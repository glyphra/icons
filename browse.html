<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Glyphra Icons</title>
  <style>
    :root {
      --accent: #2f6df6;
      --accent-soft: #e9f0ff;
      --bg: #f5f6f8;
      --surface: #fff;
      --text: #171a21;
      --muted: #697180;
      --border: #dde1e8;
      --shadow: 0 16px 40px rgba(24, 33, 50, .08);
      --icon-color: #2f6df6;
      --icon-size: 32px;
      --icon-stroke: 1.5;
    }

    [data-theme="dark"] {
      --accent: #78a0ff;
      --accent-soft: #1b2c50;
      --bg: #111318;
      --surface: #191c23;
      --text: #f2f4f8;
      --muted: #9ca5b4;
      --border: #2b303a;
      --shadow: 0 18px 48px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      background: radial-gradient(circle at 8% -20%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 34rem), var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1500px, 100%); margin: auto; padding: 34px clamp(16px, 4vw, 56px) 60px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); letter-spacing: -.05em; line-height: .95; }
    .subtitle { max-width: 620px; margin: 14px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .theme-button { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow); }
    .toolbar { position: sticky; z-index: 2; top: 12px; display: grid; grid-template-columns: minmax(240px, 2fr) minmax(160px, 1fr) auto; gap: 10px; padding: 13px; border: 1px solid var(--border); border-radius: 18px; background: color-mix(in srgb, var(--surface) 89%, transparent); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
    .search, select, .color-text { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 11px; outline: 0; background: var(--bg); color: var(--text); }
    .search { padding: 0 14px; }
    .search:focus, select:focus, .color-text:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    select { padding: 0 12px; }
    .variants { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg); }
    .variants button { border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; font-weight: 700; }
    .variants button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 2px 7px rgba(24, 33, 50, .1); }
    .adjustments { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 2px 3px 0; }
    .adjustment { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .color-input { width: 30px; height: 30px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
    .color-text { width: 88px; height: 30px; padding: 0 8px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; text-transform: uppercase; }
    input[type="range"] { width: 120px; accent-color: var(--accent); }
    output { min-width: 42px; padding: 4px 7px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-family: ui-monospace, Consolas, monospace; font-size: 11px; text-align: center; }
    .reset { margin-left: auto; padding: 7px 11px; border: 1px solid var(--border); border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .result-bar { display: flex; justify-content: space-between; gap: 16px; min-height: 54px; align-items: center; color: var(--muted); font-size: 13px; }
    .result-bar strong { color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(166px, 1fr)); gap: 11px; }
    .card { min-width: 0; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); color: inherit; text-align: left; cursor: copy; transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease; }
    .card:hover, .card:focus-visible { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 13%, transparent); outline: 0; transform: translateY(-2px); }
    .preview { display: grid; min-height: 116px; place-items: center; border-bottom: 1px solid var(--border); background-image: linear-gradient(45deg, color-mix(in srgb, var(--border) 28%, transparent) 25%, transparent 25%), linear-gradient(-45deg, color-mix(in srgb, var(--border) 28%, transparent) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, color-mix(in srgb, var(--border) 28%, transparent) 75%), linear-gradient(-45deg, transparent 75%, color-mix(in srgb, var(--border) 28%, transparent) 75%); background-position: 0 0, 0 8px, 8px -8px, -8px 0; background-size: 16px 16px; }
    .preview svg { width: var(--icon-size); height: var(--icon-size); color: var(--icon-color); }
    .preview svg [stroke]:not([stroke="none"]) { stroke-width: var(--icon-stroke) !important; }
    .info { padding: 12px 13px 13px; }
    .name, .category { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .name { font-size: 13px; font-weight: 700; }
    .category { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .empty { grid-column: 1 / -1; padding: 70px 24px; border: 1px dashed var(--border); border-radius: 16px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 17px; }
    .more { display: block; margin: 24px auto 0; padding: 10px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; font-weight: 650; }
    .more[hidden] { display: none; }
    .toast { position: fixed; right: 20px; bottom: 20px; padding: 12px 15px; border-radius: 10px; background: var(--text); color: var(--surface); opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 150ms ease, transform 150ms ease; }
    .toast.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) { .toolbar { grid-template-columns: 1fr 1fr; } .search { grid-column: 1 / -1; } }
    @media (max-width: 520px) { .shell { padding-inline: 13px; } .subtitle { display: none; } .toolbar { top: 6px; grid-template-columns: 1fr; border-radius: 15px; } .search { grid-column: auto; } .adjustments { gap: 11px; } .reset { margin-left: 0; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .preview { min-height: 96px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Glyphra icon library</p>
        <h1>Browse every icon.</h1>
        <p class="subtitle">Search by name, category, or tag. Tune the preview, then click an icon to copy production-ready SVG.</p>
      </div>
      <button class="theme-button" id="theme" type="button" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
    </header>

    <section class="toolbar" aria-label="Icon browser controls">
      <input class="search" id="search" type="search" placeholder="Search icons or tags…" autocomplete="off" aria-label="Search icons">
      <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
      <div class="variants" aria-label="Icon variant">
        <button type="button" data-variant="line" aria-pressed="true">Line</button>
        <button type="button" data-variant="fill" aria-pressed="false">Fill</button>
      </div>
      <div class="adjustments">
        <label class="adjustment">Color <input class="color-input" id="color" type="color" value="#2f6df6" aria-label="Icon color"><input class="color-text" id="colorText" type="text" value="#2F6DF6" maxlength="7" aria-label="Icon color hex value"></label>
        <label class="adjustment">Size <input id="size" type="range" min="16" max="80" step="2" value="32"><output id="sizeValue">32px</output></label>
        <label class="adjustment">Stroke <input id="stroke" type="range" min="0.5" max="4" step="0.25" value="1.5"><output id="strokeValue">1.5</output></label>
        <button class="reset" id="reset" type="button">Reset</button>
      </div>
    </section>

    <div class="result-bar"><span id="count">Loading icons…</span><span>Click any icon to copy SVG</span></div>
    <section class="grid" id="grid" aria-label="Icons"></section>
    <button class="more" id="more" type="button" hidden>Load more</button>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      var state = { variant: "line", color: "#2f6df6", size: 32, stroke: 1.5 };
      var pageSize = 160;
      var limit = pageSize;
      var icons = [];
      var filtered = [];
      var root = document.documentElement;
      var grid = document.getElementById("grid");
      var search = document.getElementById("search");
      var category = document.getElementById("category");
      var count = document.getElementById("count");
      var more = document.getElementById("more");
      var toast = document.getElementById("toast");
      var toastTimer;

      function setAttribute(svg, name, value) {
        var expression = new RegExp("\\b" + name + "=\\\"[^\\\"]*\\\"", "i");
        return expression.test(svg) ? svg.replace(expression, name + '=\"' + value + '\"') : svg.replace(/^<svg\\b/i, '<svg ' + name + '=\"' + value + '\"');
      }
      function preparedSvg(icon) {
        var svg = icon.variants[state.variant].svg;
        svg = setAttribute(setAttribute(svg, "width", state.size), "height", state.size);
        svg = svg.replace(/stroke-width=\"[^\"]*\"/gi, 'stroke-width=\"' + state.stroke + '\"').replace(/currentColor/g, state.color);
        return svg;
      }
      function render() {
        var visible = filtered.slice(0, limit);
        if (!visible.length) {
          grid.innerHTML = '<div class="empty"><strong>No icons found</strong><span>Try a different name, tag, or category.</span></div>';
        } else {
          var fragment = document.createDocumentFragment();
          visible.forEach(function (icon) {
            var card = document.createElement("button");
            card.type = "button";
            card.className = "card";
            card.dataset.icon = icon.id;
            card.title = "Copy " + icon.name + " SVG";
            card.innerHTML = '<span class="preview">' + icon.variants[state.variant].svg.replace(/^<svg\b/i, '<svg aria-hidden="true"') + '</span><span class="info"><span class="name"></span><span class="category"></span></span>';
            card.querySelector(".name").textContent = icon.name;
            card.querySelector(".category").textContent = icon.category + (icon.tags.length ? " · " + icon.tags.slice(0, 2).join(", ") : "");
            fragment.appendChild(card);
          });
          grid.replaceChildren(fragment);
        }
        more.hidden = visible.length >= filtered.length;
        count.innerHTML = "<strong>" + filtered.length.toLocaleString() + "</strong> results · " + icons.length.toLocaleString() + " icons · " + state.variant + " variant";
      }
      function filter() {
        var terms = search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        filtered = icons.filter(function (icon) { return (!category.value || icon.category === category.value) && terms.every(function (term) { return icon.searchText.indexOf(term) !== -1; }); });
        limit = pageSize;
        render();
      }
      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("visible");
        toastTimer = window.setTimeout(function () { toast.classList.remove("visible"); }, 1800);
      }
      function copy(text) {
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        var area = document.createElement("textarea");
        area.value = text; area.style.position = "fixed"; area.style.opacity = "0";
        document.body.appendChild(area); area.select(); document.execCommand("copy"); area.remove();
        return Promise.resolve();
      }
      function applyColor(value) {
        if (!/^#[0-9a-f]{6}$/i.test(value)) return false;
        state.color = value.toLowerCase();
        document.getElementById("color").value = state.color;
        document.getElementById("colorText").value = state.color.toUpperCase();
        root.style.setProperty("--icon-color", state.color);
        return true;
      }
      function reset() {
        search.value = ""; category.value = ""; state.variant = "line"; state.size = 32; state.stroke = 1.5;
        document.getElementById("size").value = 32; document.getElementById("stroke").value = 1.5;
        document.getElementById("sizeValue").textContent = "32px"; document.getElementById("strokeValue").textContent = "1.5";
        root.style.setProperty("--icon-size", "32px"); root.style.setProperty("--icon-stroke", "1.5"); applyColor("#2f6df6");
        document.querySelectorAll("[data-variant]").forEach(function (button) { button.setAttribute("aria-pressed", String(button.dataset.variant === "line")); });
        filter();
      }
      fetch(new URL("./dist/icons-map.json", document.baseURI))
        .then(function (response) { if (!response.ok) throw new Error("Icon data could not be loaded"); return response.json(); })
        .then(function (data) {
          icons = Object.values(data.icons).sort(function (a, b) { return a.name.localeCompare(b.name); });
          icons.forEach(function (icon) { icon.searchText = [icon.id, icon.name, icon.category].concat(icon.tags || []).join(" ").toLowerCase(); });
          Array.from(new Set(icons.map(function (icon) { return icon.category; }))).sort().forEach(function (name) { category.insertAdjacentHTML("beforeend", '<option value="' + name.replace(/\"/g, "&quot;") + '">' + name + '</option>'); });
          filter();
        })
        .catch(function (error) { count.textContent = error.message + ". Open browse.html from a CDN or web server."; });
      search.addEventListener("input", filter); category.addEventListener("change", filter);
      document.querySelectorAll("[data-variant]").forEach(function (button) { button.addEventListener("click", function () { state.variant = button.dataset.variant; document.querySelectorAll("[data-variant]").forEach(function (item) { item.setAttribute("aria-pressed", String(item === button)); }); render(); }); });
      document.getElementById("color").addEventListener("input", function (event) { applyColor(event.target.value); });
      document.getElementById("colorText").addEventListener("change", function (event) { if (!applyColor(event.target.value.trim())) event.target.value = state.color.toUpperCase(); });
      document.getElementById("size").addEventListener("input", function (event) { state.size = Number(event.target.value); document.getElementById("sizeValue").textContent = state.size + "px"; root.style.setProperty("--icon-size", state.size + "px"); });
      document.getElementById("stroke").addEventListener("input", function (event) { state.stroke = Number(event.target.value); document.getElementById("strokeValue").textContent = state.stroke; root.style.setProperty("--icon-stroke", state.stroke); });
      document.getElementById("reset").addEventListener("click", reset);
      document.getElementById("theme").addEventListener("click", function () { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; });
      more.addEventListener("click", function () { limit += pageSize; render(); });
      grid.addEventListener("click", function (event) { var card = event.target.closest(".card"); if (!card) return; var icon = icons.find(function (item) { return item.id === card.dataset.icon; }); if (icon) copy(preparedSvg(icon)).then(function () { showToast("Copied " + icon.name + " SVG"); }); });
    })();
  </script>
</body>
</html>
